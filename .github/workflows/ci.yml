name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the repo-specific jobs at the bottom of this file read these. A called
# workflow does not inherit caller-level `env:`; the reusable workflow declares
# its own copy of exactly the same three.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # The old `test` job ran on ubuntu-latest only. `true` would newly gate on
      # macOS and Windows, which nothing here has ever been shown to pass.
      os-matrix: false
      # The old MSRV job ran `cargo test --workspace` on 1.85, not a bare build.
      # The floor needs no input: both members inherit rust-version "1.85" from
      # [workspace.package], so the workflow derives the same 1.85.
      msrv-check: test
      # The old coverage job installed qemu-utils so the COWD/seSparse
      # cross-validation tests RUN rather than skip — its comment says the
      # measured number depends on it. Without this the 95% floor below is being
      # applied to a smaller suite than the one it was set from.
      system-packages: qemu-utils
      # Carried across exactly: the old gate was
      #   cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 95
      # a deliberate regression backstop (actual ~96.6%; the remainder is
      # fault-injection arms and refcount-width branches real corpora do not
      # reach). Not raised, not converted to the strict per-line gate.
      coverage-gate: floor
      coverage-floor: 95
      # The old coverage job passed --all-features, so the floor was measured
      # with every feature on; the default (true) is what reproduces it.
      #
      # The repo's own deny.toml, not the shared fleet config. Local is strictly
      # STRICTER: `[bans] multiple-versions = "deny"` (shared: "warn") and
      # `[advisories] ignore = []` (shared: 21 RUSTSEC ignores). Adopting the
      # shared file would loosen this gate, which an adoption PR must not do.
      deny-config-repo: ""
      # cargo-deny-action defaults its `arguments` input to `--all-features`, so
      # the old job checked the full-feature dependency graph. Carry that across.
      deny-args: --all-features
      # The shared fuzz job is a build check. This repo's `fuzz` job below is a
      # strict superset — it runs the same `cargo +nightly fuzz build` and then a
      # seeded 45s campaign per target — so the shared one would only rebuild the
      # same targets. Nothing is lost: the gate below is the old one, verbatim.
      fuzz-build-check: false

  # ---------------------------------------------------------------------------
  # Repo-specific jobs, copied verbatim from the pre-adoption ci.yml.
  # ---------------------------------------------------------------------------

  corpus:
    name: Corpus (real-world QCOW2 images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Run real-world image tests (data committed to repo)
        run: cargo test --workspace -- --nocapture

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz
      # `cargo fuzz` needs nightly `-Z` flags; force `+nightly` so the
      # rust-toolchain.toml pin (stable) can't override it — a `+toolchain` on
      # the command line beats the toml.
      - run: cargo +nightly fuzz build
      # Seed each corpus with the committed real-world images, then fuzz briefly. Any
      # crash on crafted/corrupted input fails the build.
      - name: Smoke-fuzz every target (seeded)
        run: |
          for t in fuzz_open fuzz_read fuzz_inspect fuzz_forensic; do
            mkdir -p "fuzz/corpus/$t"
            cp core/tests/data/*.qcow2 "fuzz/corpus/$t/" 2>/dev/null || true
            cargo +nightly fuzz run "$t" -- -max_total_time=45 -rss_limit_mb=4096
          done

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
